<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>急诊分诊检索系统 · 第三阶段</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef; --txt:#1f2937; --sub:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --ok:#059669; --bad:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--sub);margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:20px;margin-bottom:20px}
  .card h2{font-size:16px;margin:0 0 14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  label{color:var(--sub)}
  input,select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;
               font-size:14px;outline:none;background:#fff;color:var(--txt)}
  input:focus,select:focus{border-color:var(--brand)}
  input[type=number]{width:110px}
  button{border:0;border-radius:8px;padding:8px 16px;background:var(--brand);
         color:#fff;font-size:14px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .stat{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .pill{background:var(--brand-soft);color:var(--brand);border-radius:999px;
        padding:4px 12px;font-size:13px}
  .pill.ok{background:#ecfdf5;color:var(--ok)}
  .pill.bad{background:#fef2f2;color:var(--bad)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:center}
  th{background:#f8fafc;color:var(--sub);font-weight:600}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
  .slot{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;
        font-size:12px;background:#fff}
  .slot .idx{color:var(--sub);font-size:11px}
  .slot .val{font-weight:600}
  .slot.empty{background:#fafbfc;color:#c3cad6}
  .slot.hit{outline:2px solid var(--brand);background:var(--brand-soft)}
  .v1{background:#eef7ff}.v2{background:#dbeafe}.v3{background:#bfdbfe}
  .v4{background:#93c5fd}.v5{background:#60a5fa;color:#fff}
  .v6{background:#3b82f6;color:#fff}.v7{background:#1d4ed8;color:#fff}
  .msg{margin-top:10px;font-size:13px}
  .msg.err{color:var(--bad)}
  .trace{font-family:Consolas,monospace;font-size:12px;color:var(--sub);
         background:#f8fafc;border:1px solid var(--line);border-radius:8px;
         padding:10px;max-height:180px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>急诊分诊排队与数据检索系统</h1>
  <div class="sub">第三阶段 · 折半查找 / 哈希表（除留余数法 + 线性探测）</div>

  <!-- ============ 折半查找 ============ -->
  <div class="card">
    <h2>一、折半查找</h2>
    <div class="row">
      <label>关键字</label>
      <select id="bs-key">
        <option value="ID">就诊编号</option>
        <option value="WAIT_TIME">等待时间</option>
      </select>
      <label>查询值</label>
      <input id="bs-val" type="number" value="40">
      <button onclick="doBinarySearch()">折半查找</button>
      <button class="ghost" onclick="loadBinaryStats()">刷新判定树统计</button>
    </div>
    <div class="stat" id="bs-stat"></div>
    <div id="bs-result" class="msg"></div>
    <div id="bs-trace"></div>
    <div id="bs-table" style="margin-top:14px"></div>
  </div>

  <!-- ============ 哈希表 ============ -->
  <div class="card">
    <h2>二、哈希表（除留余数法 + 线性探测）</h2>
    <div class="row">
      <label>表长 m</label>
      <input id="ht-m" type="number" value="101">
      <label>关键字</label>
      <select id="ht-key">
        <option value="WAIT_TIME">等待时间</option>
        <option value="ID">就诊编号</option>
      </select>
      <button onclick="buildHashTable()">构建哈希表</button>
      <label>查询值</label>
      <input id="ht-val" type="number" value="264">
      <button class="ghost" onclick="hashSearch()">哈希查找</button>
    </div>
    <div class="stat" id="ht-stat"></div>
    <div id="ht-result" class="msg"></div>
    <div id="ht-slots" class="slots" style="margin-top:14px"></div>
  </div>

  <!-- ============ 装填因子实验 ============ -->
  <div class="card">
    <h2>三、装填因子对查找效率的影响（固定 m=163）</h2>
    <div class="row"><button onclick="loadExperiment()">运行实验</button></div>
    <div id="exp-table"></div>
  </div>

  <!-- ============ 多医生调度 ============ -->
  <div class="card">
    <h2>四、多医生并发调度（医生数 vs 等待时间）</h2>
    <div class="row">
      <label>医生数量</label>
      <select id="sc-docs">
        <option value="1">1 名医生</option>
        <option value="2">2 名医生</option>
        <option value="4" selected>4 名医生</option>
        <option value="8">8 名医生</option>
      </select>
      <button onclick="doSchedule()">开始调度</button>
    </div>
    <div class="stat" id="sc-stat"></div>
    <div id="sc-result" class="msg"></div>
    <div id="sc-doctors" style="margin-top:14px"></div>
  </div>
</div>

<script>
const API = "";
const $ = id => document.getElementById(id);

function show(el, html, isErr){
  el.className = "msg" + (isErr ? " err" : "");
  el.innerHTML = html;
}

async function call(method, path, body){
  const opt = { headers: { "Content-Type": "application/json" } };
  if (body) { opt.method = method; opt.body = JSON.stringify(body); }
  else if (method !== "GET") { opt.method = method; }
  const resp = await fetch(API + path, opt);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const json = await resp.json();
  if (json.code !== 200) throw new Error(json.msg || "接口返回失败");
  return json.data;
}

/* ---------- 折半查找 ---------- */
async function loadBinaryStats(){
  const keyType = $("bs-key").value;
  try{
    const d = await call("GET", `/binary/stats?keyType=${keyType}`);
    renderBsStats(d);
    $("bs-table").innerHTML = renderLevelTable(d.levelCounts, d.treeHeight);
  }catch(e){ show($("bs-result"), "加载统计失败：" + e.message, true); }
}

async function doBinarySearch(){
  const keyType = $("bs-key").value;
  const key = parseInt($("bs-val").value, 10);
  try{
    const d = await call("POST", "/binary/search", { key, keyType });
    renderBsStats(d);
    $("bs-table").innerHTML = renderLevelTable(d.levelCounts, d.treeHeight);
    const r = d.searchResult;
    if (r.found){
      show($("bs-result"), `<span class="pill ok">查找成功</span> 命中下标 <b>${r.index}</b>，
        比较 <b>${r.compares}</b> 次，患者 <b>${r.target ? r.target.name : "-"}</b>
        （编号 ${r.target ? r.target.id : "-"}，等待时间 ${r.target ? r.target.waitTime : "-"} 分钟）`);
    }else{
      show($("bs-result"), `<span class="pill bad">查找失败</span> 共比较 <b>${r.compares}</b> 次，判定树中无此关键字`);
    }
    $("bs-trace").innerHTML = d.trace && d.trace.length
      ? `<div class="trace">${d.trace.join("\n")}</div>` : "";
  }catch(e){ show($("bs-result"), "查询失败：" + e.message, true); }
}

function renderBsStats(d){
  $("bs-stat").innerHTML = `
    <span class="pill">元素个数 ${d.sortedByKey ? d.sortedByKey.length : 0}</span>
    <span class="pill">判定树高 ${d.treeHeight}</span>
    <span class="pill">ASL(成功) ${d.aslSuccess.toFixed(2)} 次</span>
    <span class="pill">ASL(失败) ${d.aslFailure.toFixed(2)} 次</span>`;
}

function renderLevelTable(levelCounts, height){
  let rows = "", successSum = 0, n = 0;
  for (let i = 1; i <= height; i++){
    const c = levelCounts[i] || 0;
    n += c; successSum += i * c;
    rows += `<tr><td>${i}</td><td>${c}</td><td>${i * c}</td></tr>`;
  }
  return `<table>
    <thead><tr><th>层数</th><th>结点个数</th><th>层数×个数</th></tr></thead>
    <tbody>${rows}
      <tr><th>合计</th><th>${n}</th><th>${successSum}</th></tr>
      <tr><th>外部结点</th><th>${n + 1}</th><th>—</th></tr>
    </tbody></table>
    <div class="sub" style="margin-top:8px">
      说明：内部结点 n=${n} 个为成功查找位置，外部结点 ${n + 1} 个为失败位置；
      成功 ASL = ${successSum}/${n}，失败 ASL 按外部结点路径长度求平均。
    </div>`;
}

/* ---------- 哈希表 ---------- */
let lastSlots = [];

async function buildHashTable(){
  const m = parseInt($("ht-m").value, 10);
  const keyType = $("ht-key").value;
  try{
    const d = await call("POST", "/hash/build", { tableLength: m, keyType });
    lastSlots = d.slots;
    renderHtSummary(d.summary);
    renderSlots(d.slots, -1);
    show($("ht-result"), "哈希表构建完成，完整存储结构见下方槽位图。");
  }catch(e){ show($("ht-result"), "构建失败：" + e.message, true); }
}

async function hashSearch(){
  const m = parseInt($("ht-m").value, 10);
  const keyType = $("ht-key").value;
  const key = parseInt($("ht-val").value, 10);
  try{
    const d = await call("POST", "/hash/search", { key, keyType, tableLength: m });
    lastSlots = d.slots;
    renderHtSummary(d.summary);
    const r = d.searchResult;
    renderSlots(d.slots, r.found ? r.slot : -1);
    if (r.found){
      show($("ht-result"), `<span class="pill ok">查找成功</span> 槽位 <b>${r.slot}</b>，
        比较 <b>${r.compares}</b> 次，患者 <b>${r.target ? r.target.name : "-"}</b>`);
    }else{
      show($("ht-result"), `<span class="pill bad">查找失败</span> 比较 <b>${r.compares}</b> 次（探测到空槽）`);
    }
  }catch(e){ show($("ht-result"), "查询失败：" + e.message, true); }
}

function renderHtSummary(s){
  $("ht-stat").innerHTML = `
    <span class="pill">m=${s.m}，p=${s.p}</span>
    <span class="pill">n=${s.n}</span>
    <span class="pill">α=${s.loadFactor.toFixed(2)}</span>
    <span class="pill">ASL(成功) ${s.aslSuccess.toFixed(2)}</span>
    <span class="pill">ASL(失败) ${s.aslFailure.toFixed(2)}</span>
    <span class="pill">冲突元素 ${s.collisionCount}</span>
    <span class="pill">最长探测 ${s.maxProbeLength} 次</span>`;
}

function renderSlots(slots, hitSlot){
  $("ht-slots").innerHTML = slots.map(s => {
    const cls = s.key === null ? "slot empty" : ("slot v" + Math.min(7, Math.max(1, s.probeCount || 1)));
    const hit = s.slot === hitSlot ? " hit" : "";
    const val = s.key === null ? "空" : s.key;
    return `<div class="${cls}${hit}"><div class="idx">[${s.slot}]</div>
            <div class="val">${val}</div>
            <div class="idx">${s.probeCount === null ? "—" : s.probeCount + " 次"}</div></div>`;
  }).join("");
}

/* ---------- 装填因子实验 ---------- */
async function loadExperiment(){
  try{
    const d = await call("GET", "/hash/experiment?keyType=WAIT_TIME");
    let rows = d.rows.map(r => `<tr>
        <td>${r.n}</td><td>${r.alpha.toFixed(2)}</td>
        <td>${r.aslSuccess.toFixed(2)}</td><td>${r.theorySuccess.toFixed(2)}</td>
        <td>${r.aslFailure.toFixed(2)}</td><td>${r.theoryFailure.toFixed(2)}</td>
        <td>${r.collisionCount}</td><td>${r.maxProbeLength}</td></tr>`).join("");
    $("exp-table").innerHTML = `<table>
      <thead><tr><th>n</th><th>α</th><th>实测成功</th><th>理论成功</th>
      <th>实测失败</th><th>理论失败</th><th>冲突元素</th><th>最长探测</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="sub" style="margin-top:8px">
        理论值：成功 ≈ ½(1+1/(1-α))，失败 ≈ ½(1+1/(1-α)²)。α→1 时失败 ASL 平方级恶化。
      </div>`;
  }catch(e){ $("exp-table").innerHTML = `<div class="msg err">实验失败：${e.message}</div>`; }
}

/* ---------- 多医生调度 ---------- */
async function doSchedule(){
  const doctorCount = parseInt($("sc-docs").value, 10);
  try{
    // 1. 应用医生数 → 重建折半查找/哈希表的数据源
    const applyMsg = await call("POST", `/schedule/apply?doctorCount=${doctorCount}`);
    // 2. 获取调度展示
    const d = await call("GET", `/schedule/dispatch?doctorCount=${doctorCount}`);
    $("sc-stat").innerHTML = `
      <span class="pill">医生 ${d.doctorCount} 名</span>
      <span class="pill">患者 ${d.patientCount} 人</span>
      <span class="pill ok">平均等待 ${d.avgWaitTime} 分钟</span>
      <span class="pill bad">最长等待 ${d.maxWaitTime} 分钟</span>`;
    $("sc-doctors").innerHTML = renderDoctors(d.doctors);
    show($("sc-result"), applyMsg + "，折半查找/哈希表已同步更新。");
    // 3. 刷新折半查找与哈希表的展示
    await loadBinaryStats();
    await buildHashTable();
  }catch(e){ show($("sc-result"), "调度失败：" + e.message, true); }
}

function renderDoctors(doctors){
  return doctors.map(d => {
    const pts = (d.patients && d.patients.length)
      ? d.patients.map(p => `<span class="pill">${p.id}（等 ${p.waitTime} 分）</span>`).join("")
      : "<span class='sub'>无接诊</span>";
    return `<div class="card" style="margin-bottom:10px">
      <b>医生${d.doctorId}</b> <span class="sub">（接诊 ${d.handledCount} 人）</span>
      <div class="stat" style="margin-top:8px">${pts}</div>
    </div>`;
  }).join("");
}

/* 初始化 */
loadBinaryStats();
buildHashTable();
doSchedule();
</script>
</body>
</html>
