<!--HTML5文档-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>急诊分诊系统</title>
<style>
  /*
  内嵌CSS——先设置字体、颜色、位置等等
   */
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f3f5f9; color: #26303a; line-height: 1.5;
  }
  header {
    background: #1f6feb; color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 20px; }
  #loginState { font-size: 14px; opacity: .95; }
  .wrap { max-width: 1080px; margin: 20px auto; padding: 0 16px; }
  .card {
    background: #fff; border-radius: 10px; padding: 18px 20px;
    margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card h2 { margin: 0 0 14px; font-size: 17px; color: #1f6feb; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  label { font-size: 13px; color: #5b6b7b; }
  input, select {
    padding: 7px 10px; border: 1px solid #ccd4de; border-radius: 6px; font-size: 14px;
  }
  input[type=text], input[type=password], input[type=number] { width: 140px; }
  button {
    padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
    background: #1f6feb; color: #fff; font-size: 14px;
  }
  button:hover { background: #1858c0; }
  button.secondary { background: #64748b; }
  button.secondary:hover { background: #475569; }
  button.danger { background: #e5484d; }
  button:disabled { background: #a8b3c2; cursor: not-allowed; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #e2e8f0; padding: 6px 9px; text-align: left; }
  th { background: #f0f4fa; }
  .out { margin-top: 12px; }
  .msg { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; }
  .msg.ok { background: #e6f6ec; color: #1a7f37; }
  .msg.err { background: #fdecec; color: #c0392b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .doc { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; }
  .doc .t { font-weight: 600; margin-bottom: 4px; }
  .doc .s { font-size: 12px; color: #5b6b7b; margin-bottom: 6px; }
  .pat { font-size: 12px; background: #f7f9fc; border-radius: 4px; padding: 3px 6px; margin: 3px 0; }
  .slot { display: inline-block; width: 46px; padding: 4px 2px; margin: 3px; text-align: center;
          font-size: 11px; border-radius: 5px; border: 1px solid #e2e8f0; background: #f7f9fc; }
  .slot.filled { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
  .slot.hit { background: #fde68a; border-color: #f59e0b; color: #92400e; }

  /* 折半查找判定树样式 */
  .bstree-viewport {
    position: relative; overflow: hidden; height: 420px;
    border: 1px solid #e2e8f0; border-radius: 8px;
    background: #fbfcfe; cursor: grab;
  }
  .bstree-viewport:active { cursor: grabbing; }
  .tree-zoom { display: inline-flex; align-items: center; gap: 6px; }
  .tree-zoom input[type=range] { width: 130px; vertical-align: middle; }
  .bstree {
    position: absolute; top: 16px; left: 16px;
    transform-origin: top left; user-select: none;
    white-space: nowrap;
  }
  .bstree ul { display: flex; justify-content: center; list-style: none; margin: 0; padding: 0; }
  .bstree li {
    display: flex; flex-direction: column; align-items: center;
    position: relative; padding: 16px 6px 0;
  }
  .bstree li::before {
    content: ''; position: absolute; top: 0; left: 50%;
    height: 16px; border-left: 1px solid #b9c4d0;
  }
  .bstree li::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 1px; background: #b9c4d0;
  }
  .bstree li:first-child::after { left: 50%; }
  .bstree li:last-child::after { right: 50%; }
  .bstree li:only-child::after { display: none; }
  .bstree > ul > li::before, .bstree > ul > li::after { display: none; }
  .bstree-node {
    display: inline-block; min-width: 40px; padding: 5px 8px; text-align: center;
    border: 1px solid #93c5fd; border-radius: 6px; background: #dbeafe; color: #1d4ed8;
    font-weight: 600; font-size: 12px; position: relative; z-index: 1;
  }
  .bstree-node.empty {
    background: transparent; border: 1px dashed #cbd5e1; color: #94a3b8; font-weight: 400;
  }
  .hidden { display: none !important; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  button.ghost {
    background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.4);
    padding: 6px 12px;
  }
  button.ghost:hover { background: rgba(255,255,255,.28); }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-box {
    background: #fff; border-radius: 12px; padding: 24px; width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .modal-box h2 { margin: 0 0 16px; font-size: 18px; color: #1f6feb; }
  .modal-box .actions { margin-top: 16px; text-align: right; }
  .muted { color: #8494a5; font-size: 12px; }
  #simClock { margin-left: auto; font-size: 13px; color: #1f6feb; font-weight: 600; }

  /* 登录页 */
  #loginView {
    min-height: 100vh;
    display: flex;
    align-items: center;
    background:
      linear-gradient(rgba(10, 36, 72, .55), rgba(10, 36, 72, .72)),
      url('bg.jpg') center / cover no-repeat;
  }
  .login-left {
    flex: 1 1 55%;
    padding: 60px 80px;
    color: #fff;
    display: flex; flex-direction: column; justify-content: center;
  }
  .login-left h1 {
    font-size: 64px; margin: 0 0 18px; font-weight: 700; letter-spacing: 3px;
    text-shadow: 0 2px 14px rgba(0,0,0,.35);
  }
  .login-left .sub { font-size: 18px; opacity: .92; letter-spacing: 1px; }
  .login-right {
    flex: 0 0 420px;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .login-box {
    width: 100%; background: #fff; border-radius: 14px; padding: 36px 30px;
    box-shadow: 0 14px 46px rgba(0,0,0,.25);
  }
  .login-box h2 { margin: 0 0 22px; font-size: 22px; color: #1f6feb; }
  .login-box .field { margin-bottom: 18px; }
  .login-box label { display: block; margin-bottom: 7px; font-size: 13px; }
  .login-box input { width: 100%; padding: 11px 12px; font-size: 15px; }
  .login-box button { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; }
  .login-box .muted { margin-top: 14px; }
  @media (max-width: 820px) {
    #loginView { flex-direction: column; }
    .login-left { flex: none; padding: 44px 24px 16px; text-align: center; }
    .login-left h1 { font-size: 34px; }
    .login-right { flex: none; width: 100%; }
  }

  /*  功能页布局——导航+内容 */
  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .sidenav {
    flex: 0 0 190px;
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    padding: 8px 0; position: sticky; top: 20px; overflow: hidden;
  }
  .nav-item {
    display: block; width: 100%; text-align: left; padding: 13px 18px;
    background: transparent; color: #26303a; border-radius: 0; border-left: 3px solid transparent;
    font-size: 14px;
  }
  .nav-item:hover { background: #f0f4fa; color: #1f6feb; }
  .nav-item.active { background: #e8f0fe; color: #1f6feb; border-left-color: #1f6feb; font-weight: 600; }
  .content { flex: 1 1 auto; min-width: 0; }
  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>
<header id="topBar" class="hidden">
  <h1>急诊分诊系统</h1>
  <div class="top-right">
    <span id="loginState">未登录</span>
    <button class="ghost" data-action="home">用户主页</button>
    <button class="ghost" data-action="logout">退出登录</button>
  </div>
</header>

<!--  登录界面  -->
<div id="loginView">
  <div class="login-left">
    <h1>急诊分诊系统</h1>
    <div class="sub">——分诊排队与数据检索</div>
  </div>
  <div class="login-right">
    <div class="login-box">
      <h2>登录</h2>
      <div class="field">
        <label>账号</label>
        <input type="text" id="username" value="admin" autocomplete="off">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" value="123456">
      </div>
      <button data-action="login">登录</button>
      <div id="loginOut"></div>
      <div class="muted">登录后进入功能界面。</div>
    </div>
  </div>
</div>

<!--  功能界面  -->
<div class="wrap hidden" id="mainView">
  <div class="layout">
    <nav class="sidenav">
      <button class="nav-item active" data-nav="queue">排队调度</button>
      <button class="nav-item" data-nav="binary">折半查找</button>
      <button class="nav-item" data-nav="hash">哈希表</button>
    </nav>
    <div class="content">
      <section class="panel active" id="panel-queue">

  <!-- 排队调度 -->
  <div class="card">
    <h2>排队调度（多医生队列）</h2>
    <div class="row">
      <label>医生人数</label>
      <input type="number" id="doctorCount" value="8" min="1">
      <button data-action="qLoad">加载数据</button>
    </div>
    <div class="row">
      <label>医生编号</label>
      <select id="doctorIndex"></select>
      <button data-action="qTreat">治疗队首</button>
      <button class="secondary" data-action="qAvg">平均等待时间</button>
      <button class="secondary" data-action="qSort">堆排序</button>
      <button class="danger" data-action="qReset">重置(管理员)</button>
    </div>
    <div class="row">
      <label>放弃排队(管理员)</label>
      <input type="number" id="removeId" placeholder="患者数字编号" min="1">
      <button class="danger" data-action="qRemove">放弃</button>
      <span id="simClock">模拟时间：--</span>
      <button class="secondary" id="clockToggle" data-action="clockToggle">暂停</button>
    </div>
    <div class="out" id="queueOut"></div>
  </div>

      </section>
      <section class="panel" id="panel-binary">

  <!-- 折半查找 -->
  <div class="card">
    <h2>折半查找</h2>
    <div class="row">
      <label>关键字</label>
      <select id="binKeyType">
        <option value="ID">就诊编号 ID</option>
        <option value="WAIT_TIME">总体等待时间 WAIT_TIME</option>
      </select>
      <label>查找值</label>
      <input type="number" id="binKey" value="1">
      <button data-action="binPatients">查看有序序列</button>
      <button class="secondary" data-action="binStats">判定树统计</button>
      <button data-action="binSearch">查找</button>
    </div>
    <div class="out" id="binOut"></div>
  </div>

      </section>
      <section class="panel" id="panel-hash">

  <!-- 哈希表 -->
  <div class="card">
    <h2>哈希表（除留余数法 + 线性探测）</h2>
    <div class="row">
      <label>关键字</label>
      <select id="hashKeyType">
        <option value="WAIT_TIME">总体等待时间 WAIT_TIME</option>
        <option value="ID">就诊编号 ID</option>
      </select>
      <label>表长 m</label>
      <input type="number" id="hashM" value="101">
      <label>查找值</label>
      <input type="number" id="hashKey" value="0">
      <button data-action="hashBuild">建表</button>
      <button class="secondary" data-action="hashSearch">查找</button>
      <button class="secondary" data-action="hashExp">装填因子实验</button>
    </div>
    <div class="out" id="hashOut"></div>
  </div>

      </section>
    </div>
  </div>
</div>

<!-- 用户主页弹窗 -->
<div class="modal hidden" id="homeModal">
  <div class="modal-box">
    <h2>用户主页</h2>
    <div id="homeOut">加载中...</div>
    <div class="actions">
      <button data-action="homeClose">关闭</button>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = 'token';
const $ = id => document.getElementById(id);

function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t){ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }

function show(id, html){ $(id).innerHTML = html; }
function okHtml(t){ return '<div class="msg ok">' + t + '</div>'; }
function errHtml(t){ return '<div class="msg err">' + (t || '出错了') + '</div>'; }

async function api(path, opts = {}){
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if (token) headers['X-Token'] = token;
  const resp = await fetch(path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body === undefined ? undefined : JSON.stringify(opts.body)
  });
  let json;
  try { json = await resp.json(); }
  catch (e) { throw new Error('响应不是 JSON（HTTP ' + resp.status + '）'); }
  if (json.code !== 200) {
    throw new Error(json.msg || ('请求失败，code=' + json.code));
  }
  return json.data;
}

// 统一包装：出错时把错误显示到指定输出区
async function run(work, outId){
  try { return await work(); }
  catch (e) { show(outId, errHtml(e.message)); return null; }
}

//  登录 / 视图切换
let clockTimer = null;

function enterMain(username, role){
  $('loginState').textContent = '已登录：' + (username || '?') + (role ? '（' + role + '）' : '');
  $('topBar').classList.remove('hidden');
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  clockPaused = false;
  $('clockToggle').textContent = '暂停';
  startClock();
}

function showLoginView(){
  $('loginState').textContent = '未登录';
  $('topBar').classList.add('hidden');
  $('mainView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  stopClock();
}

function refreshLoginState(){
  const token = getToken();
  if (!token) { showLoginView(); return; }
  api('/login/current').then(data => {
    enterMain(data && data.username, data && data.role);
  }).catch(() => {
    setToken('');
    showLoginView();
  });
}

async function login(){
  const username = $('username').value.trim();
  const password = $('password').value.trim();
  try {
    const data = await api('/login', { method: 'POST', body: { username, password } });
    setToken(data.token);
    show('loginOut', okHtml('登录成功：' + data.username + '（' + data.role + '）'));
    enterMain(data.username, data.role);
  } catch (e) {
    show('loginOut', errHtml(e.message));
  }
}

function logout(){
  api('/login/logout', { method: 'POST' }).catch(()=>{});
  setToken('');
  show('loginOut', okHtml('已退出登录'));
  showLoginView();
}

//  用户主页
async function home(){
  $('homeModal').classList.remove('hidden');
  $('homeOut').innerHTML = '<div class="muted">加载中...</div>';
  try {
    const d = await api('/login/current');
    $('homeOut').innerHTML =
      '<table><tr><th>用户名</th><td>' + esc(d.username) + '</td></tr>' +
      '<tr><th>角色</th><td>' + esc(d.role) + '</td></tr></table>';
  } catch (e) {
    $('homeOut').innerHTML = errHtml(e.message);
  }
}
function homeClose(){
  $('homeModal').classList.add('hidden');
}

// 渲染
function esc(s){
  if (s === null || s === undefined) return '-';
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderPatients(list){
  if (!list || !list.length) return '<div class="muted">暂无患者</div>';
  let h = '<table><tr><th>编号</th><th>姓名</th><th>到达</th><th>治疗(min)</th><th>优先级</th><th>总体等待(min)</th><th>即时等待(min)</th></tr>';
  for (const p of list) {
    h += '<tr><td>' + esc(p.id) + '</td><td>' + esc(p.name || p.id) + '</td>' +
         '<td>' + esc(p.arriveTime) + '</td><td>' + esc(p.treatTime) + '</td>' +
         '<td>' + esc(p.priority) + '</td><td>' + esc(p.totalWaitTime) + '</td>' +
         '<td>' + esc(p.currentWaitTime) + '</td></tr>';
  }
  return h + '</table>';
}

// 排队调度
function renderQueues(list){
  if (!list || !list.length) return '<div class="muted">暂无队列数据，请先「加载数据」</div>';
  let h = '<div class="grid">';
  for (const q of list) {
    h += '<div class="doc"><div class="t">' + esc(q.doctorName) +
         '</div><div class="s">人数 ' + q.queueSize + ' / 容量 ' + q.capacity +
         '，平均等待 ' + (q.avgWaitTime == null ? '-' : Number(q.avgWaitTime).toFixed(1)) + ' min，队头 ' + q.front + '，队尾 ' + q.rear + '</div>';
    if (q.patientList && q.patientList.length) {
      for (const p of q.patientList) {
        h += '<div class="pat">' + esc(p.id) + '（' + esc(p.name || p.id) + '）优先 ' +
             esc(p.priority) + '，治疗 ' + esc(p.treatTime) + 'min，总体 ' +
             esc(p.totalWaitTime) + ' / 即时 ' + esc(p.currentWaitTime) + ' min</div>';
      }
    } else {
      h += '<div class="muted">空</div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

function refreshDoctorSelect(count){
  const sel = $('doctorIndex');
  sel.innerHTML = '';
  const n = Math.max(1, Number(count) || 8);
  for (let i = 0; i < n; i++) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = '医生' + (i + 1);
    sel.appendChild(o);
  }
}

let dataLoaded = false;

async function qLoad(){
  const n = Number($('doctorCount').value) || 8;
  refreshDoctorSelect(n);
  const d = await run(() => api('/queue/load?doctorCount=' + n), 'queueOut');
  if (d) {
    dataLoaded = true;
    show('queueOut', okHtml('已加载数据（' + n + ' 名医生，模拟时钟自动推进）') + renderQueues(d));
  }
  updateClock();
}
async function qTreat(){
  const i = $('doctorIndex').value;
  const d = await run(() => api('/queue/treat?doctorIndex=' + i), 'queueOut');
  if (d) show('queueOut', renderQueues(d));
  updateClock();
}
async function qAvg(){
  const d = await run(() => api('/queue/avg'), 'queueOut');
  if (d != null) show('queueOut', okHtml('全局平均等待时间：' + Number(d).toFixed(2) + ' 分钟'));
}
async function qSort(){
  const d = await run(() => api('/queue/sort'), 'queueOut');
  if (d) show('queueOut', okHtml('按总体等待时间升序（堆排序）') + renderPatients(d));
}
async function qReset(){
  const d = await run(() => api('/queue/reset'), 'queueOut');
  if (d) show('queueOut', okHtml('已重置') + renderQueues(d));
  updateClock();
}
async function qRemove(){
  const id = Number($('removeId').value);
  if (!id) { show('queueOut', errHtml('请输入患者数字编号')); return; }
  const d = await run(() => api('/queue/remove?id=' + id, { method: 'DELETE' }), 'queueOut');
  if (d) show('queueOut', okHtml('已放弃排队') + renderQueues(d));
  updateClock();
}

// 模拟时钟
async function updateClock(){
  try {
    const t = await api('/queue/now');
    $('simClock').textContent = '模拟时间：' + t;
  } catch (e) {
    $('simClock').textContent = '模拟时间：--';
  }
}
async function autoTick(){
  updateClock();
  // 已加载数据时，自动同步队列显示
  if (dataLoaded) {
    try {
      const d = await api('/queue/status');
      if (d) show('queueOut', renderQueues(d));
    } catch (e) {}
  }
}
function startClock(){
  if (clockTimer) return;
  autoTick();
  clockTimer = setInterval(autoTick, 2000);
}
function stopClock(){
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
}
let clockPaused = false;
function clockToggle(){
  if (clockPaused) {
    clockPaused = false;
    $('clockToggle').textContent = '暂停';
    startClock();
  } else {
    clockPaused = true;
    $('clockToggle').textContent = '开始';
    stopClock();
  }
}

// 折半查找
function renderBinResponse(r, showTree){
  let h = '';
  if (r.searchResult) {
    const s = r.searchResult;
    h += '<div class="msg ' + (s.found ? 'ok' : 'err') + '">' +
         (s.found ? '命中：下标 ' + s.index + '，比较 ' + s.compares + ' 次' : '未找到，比较 ' + s.compares + ' 次') + '</div>';
    if (s.target) h += renderPatients([s.target]);
  }
  if (r.trace && r.trace.length) {
    h += '<div class="muted">比较轨迹：' + r.trace.map(esc).join(' ｜ ') + '</div>';
  }
  if (r.aslSuccess != null) {
    h += '<div class="muted">ASL成功=' + Number(r.aslSuccess).toFixed(3) +
         '，ASL失败=' + Number(r.aslFailure).toFixed(3) +
         '，树高=' + r.treeHeight + '</div>';
  }
  if (r.levelCounts) {
    h += '<div class="muted">各层结点数：' + JSON.stringify(r.levelCounts) + '</div>';
  }
  if (r.tree && showTree) {
    h += '<div class="muted" style="margin-top:12px">判定树（方框为关键字值，虚线框为查找失败位置）' +
         ' <label class="tree-zoom">缩放 <input type="range" id="treeZoomSlider" min="0.2" max="3" step="0.1" value="' + treeZoom + '">' +
         ' <span id="treeZoomLabel">' + treeZoom.toFixed(1) + 'x</span></label></div>';
    h += renderDecisionTree(r.tree);
  }
  if (r.sortedByKey) h += '<div style="margin-top:8px">' + renderPatients(r.sortedByKey) + '</div>';
  return h;
}

function renderDecisionTree(node){
  if (!node) return '';
  function draw(n){
    if (!n) return '<li><span class="bstree-node empty">×</span></li>';
    let kids = '';
    if (n.left || n.right) kids = '<ul>' + draw(n.left) + draw(n.right) + '</ul>';
    return '<li><span class="bstree-node">' + esc(n.value) + '</span>' + kids + '</li>';
  }
  return '<div class="bstree-viewport">' +
         '<div class="bstree" id="binTreeBox" style="transform:translate(' + panX + 'px,' + panY + 'px) scale(' + treeZoom + ')">' +
         '<ul>' + draw(node) + '</ul></div></div>';
}

let treeZoom = 1;
let panX = 0, panY = 0, dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;

function applyTreeTransform(){
  const el = document.getElementById('binTreeBox');
  if (el) el.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + treeZoom + ')';
}
document.addEventListener('input', e => {
  if (e.target.id !== 'treeZoomSlider') return;
  treeZoom = parseFloat(e.target.value);
  const lb = document.getElementById('treeZoomLabel');
  if (lb) lb.textContent = treeZoom.toFixed(1) + 'x';
  applyTreeTransform();
});

document.addEventListener('mousedown', e => {
  const vp = e.target.closest('.bstree-viewport');
  if (!vp) return;
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  origX = panX; origY = panY;
  vp.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = origX + (e.clientX - startX);
  panY = origY + (e.clientY - startY);
  applyTreeTransform();
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  document.querySelectorAll('.bstree-viewport').forEach(v => v.style.cursor = 'grab');
});
async function binPatients(){
  const k = $('binKeyType').value;
  const d = await run(() => api('/binary/patients?keyType=' + k), 'binOut');
  if (d) show('binOut', okHtml('按 ' + k + ' 升序的序列') + renderPatients(d));
}
async function binStats(){
  const k = $('binKeyType').value;
  const d = await run(() => api('/binary/stats?keyType=' + k), 'binOut');
  if (d) show('binOut', renderBinResponse(d, true));
}
async function binSearch(){
  const k = $('binKeyType').value;
  const key = $('binKey').value;
  const d = await run(() => api('/binary/search', { method: 'POST', body: { key: Number(key), keyType: k } }), 'binOut');
  if (d) show('binOut', renderBinResponse(d, false));
}

// 哈希表
function renderHashResponse(r){
  let h = '';
  if (r.summary) {
    const s = r.summary;
    h += '<div class="muted">m=' + s.m + '，p=' + s.p + '，n=' + s.n +
         '，α=' + Number(s.loadFactor).toFixed(3) +
         '，ASL成功=' + Number(s.aslSuccess).toFixed(3) +
         '，ASL失败=' + Number(s.aslFailure).toFixed(3) +
         '，冲突元素=' + s.collisionCount + '，最长探测=' + s.maxProbeLength + '</div>';
  }
  if (r.searchResult) {
    const s = r.searchResult;
    h += '<div class="msg ' + (s.found ? 'ok' : 'err') + '">' +
         (s.found ? '命中槽位 ' + s.slot + '，比较 ' + s.compares + ' 次' : '未找到，比较 ' + s.compares + ' 次') + '</div>';
    if (s.target) h += renderPatients([s.target]);
  }
  if (r.slots && r.slots.length) {
    const hitSlot = r.searchResult ? r.searchResult.slot : -1;
    h += '<div style="margin-top:8px">';
    for (const sl of r.slots) {
      const cls = sl.slot === hitSlot ? 'slot hit' : (sl.key != null ? 'slot filled' : 'slot');
      const label = sl.key != null ? sl.key : '·';
      h += '<span class="' + cls + '" title="槽位 ' + sl.slot + '">' + esc(label) + '</span>';
    }
    h += '</div>';
  }
  return h;
}
async function hashBuild(){
  const k = $('hashKeyType').value, m = Number($('hashM').value);
  const d = await run(() => api('/hash/build', { method: 'POST', body: { tableLength: m, keyType: k } }), 'hashOut');
  if (d) show('hashOut', okHtml('建表完成（关键字=' + k + '）') + renderHashResponse(d));
}
async function hashSearch(){
  const k = $('hashKeyType').value, m = Number($('hashM').value), key = Number($('hashKey').value);
  const d = await run(() => api('/hash/search', { method: 'POST', body: { key, keyType: k, tableLength: m } }), 'hashOut');
  if (d) show('hashOut', renderHashResponse(d));
}
async function hashExp(){
  const k = $('hashKeyType').value;
  const d = await run(() => api('/hash/experiment?keyType=' + k), 'hashOut');
  if (d && d.rows) {
    let h = '<table><tr><th>n</th><th>α</th><th>ASL成功(实测)</th><th>ASL成功(理论)</th><th>ASL失败(实测)</th><th>ASL失败(理论)</th><th>冲突元素</th><th>最长探测</th></tr>';
    for (const r of d.rows) {
      h += '<tr><td>' + r.n + '</td><td>' + Number(r.alpha).toFixed(3) + '</td>' +
           '<td>' + Number(r.aslSuccess).toFixed(3) + '</td><td>' + Number(r.theorySuccess).toFixed(3) + '</td>' +
           '<td>' + Number(r.aslFailure).toFixed(3) + '</td><td>' + Number(r.theoryFailure).toFixed(3) + '</td>' +
           '<td>' + r.collisionCount + '</td><td>' + r.maxProbeLength + '</td></tr>';
    }
    h += '</table>';
    show('hashOut', okHtml('装填因子实验（表长 ' + d.tableLength + '）') + h);
  }
}

//data-action 委托
const actions = {
  login, logout, home, homeClose, clockToggle,
  qLoad, qTreat, qAvg, qSort, qReset, qRemove,
  binPatients, binStats, binSearch,
  hashBuild, hashSearch, hashExp
};

  const btn = e.target.closest('[data-action]');

});

  if (e.key === 'Enter' && (e.target.id === 'username' || e.target.id === 'password')) {
    login();
  }
});

//  左侧导航切换
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

    document.getElementById('panel-' + item.getAttribute('data-nav')).classList.add('active');
  });
});

refreshDoctorSelect(8);
refreshLoginState();
